ва Ø1,08 м, кровать +0,80</text><text x="706" y="335" font-family="Arial,sans-serif" font-size="14" fill="#222" text-anchor="start">6. Засыпня над жерновами</text><text x="706" y="365" font-family="Arial,sans-serif" font-size="14" fill="#222" text-anchor="start">7. Толчея и общий толчейный вал</text><text x="706" y="395" font-family="Arial,sans-serif" font-size="14" fill="#222" text-anchor="start">8. Щеподральня за боковой стеной</text><text x="706" y="425" font-family="Arial,sans-serif" font-size="14" fill="#222" text-anchor="start">9. Ворот и воробина, ручной привод</text><text x="706" y="455" font-family="Arial,sans-serif" font-size="14" fill="#222" text-anchor="start">10. Лоток: к ободу на высоте оси</text><text x="706" y="485" font-family="Arial,sans-serif" font-size="14" fill="#222" text-anchor="start">11. Пол +0,000 и взвоз к входу</text><text x="706" y="515" font-family="Arial,sans-serif" font-size="14" fill="#222" text-anchor="start">12. Лестница вниз к ступам (−1,800)</text><text x="706" y="560" font-family="Arial,sans-serif" font-size="14" fill="#555" text-anchor="start">Здание: 7,80 × 10,15 м по осям.</text><text x="706" y="587" font-family="Arial,sans-serif" font-size="14" fill="#555" text-anchor="start">Помещение колеса: 3,50 м по длине.</text><text x="706" y="614" font-family="Arial,sans-serif" font-size="14" fill="#555" text-anchor="start">Помольный вал: ось −0,470 м.</text><text x="706" y="641" font-family="Arial,sans-serif" font-size="14" fill="#555" text-anchor="start">Толчейный вал: ось +0,980 м.</text><text x="706" y="668" font-family="Arial,sans-serif" font-size="14" fill="#555" text-anchor="start">Пунктир: верхние и перекрывающие узлы.</text><line x1="710.00" y1="720.00" x2="772.00" y2="720.00" stroke="#171717" stroke-width="2"/><line x1="710.00" y1="714.00" x2="710.00" y2="726.00" stroke="#171717" stroke-width="1.4"/><line x1="772.00" y1="714.00" x2="772.00" y2="726.00" stroke="#171717" stroke-width="1.4"/><text x="741.0" y="744" font-family="Arial,sans-serif" font-size="13" fill="#222" text-anchor="middle">1 м</text><text x="52" y="1321" font-family="Arial,sans-serif" font-size="14" fill="#555" text-anchor="start">Основание: «6 ВодянаяЭП М 150» — планы PDF 16–18, разрезы 23–31, виды 32–40.</text><text x="52" y="1347" font-family="Arial,sans-serif" font-size="14" fill="#555" text-anchor="start">Уточнение крупных узлов: «7 ВодянаяАС», PDF 32–38. Пропорции сохранены, мелкие детали упрощены.</text><text x="52" y="1373" font-family="Arial,sans-serif" font-size="14" fill="#555" text-anchor="start">Эта схема показывает компоновку: соединения, профили зубьев и строительные допуски не рассчитывались.</text><text x="52" y="1399" font-family="Arial,sans-serif" font-size="14" fill="#555" text-anchor="start">Зеркальная ориентация сохранена по запросу; подписи относятся к модели, а не к осям исходного плана.</text></svg>
